name: Build PonWrt supported PON devices

on:
  schedule:
    # UTC Saturday 20:17 = Sunday 04:17 in Asia/Shanghai.
    - cron: '17 20 * * 6'
  workflow_dispatch:
    inputs:
      source_ref:
        description: PonWrt commit, branch or tag (master follows upstream)
        required: true
        default: master
        type: string
      publish_release:
        description: Publish all validated device images as a formal release
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: ponwrt-all-devices-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/pbs05/ponwrt.git
  SOURCE_REF: ${{ inputs.source_ref || 'master' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.plan.outputs.source_commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve shared source, device catalog and feeds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init source
          git -C source remote add origin "$SOURCE_REPO"
          git -C source fetch --depth=1 -- origin "$SOURCE_REF"
          git -C source checkout --detach FETCH_HEAD
          mkdir -p build-plan
          python3 scripts/devices.py discover source build-plan/catalog.json
          python3 scripts/resolve-feeds.py source
          cp source/feeds.conf.default source/feeds-resolution.json build-plan/
          python3 - <<'PY'
          import json, os, pathlib
          catalog = json.loads(pathlib.Path('build-plan/catalog.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + catalog['source_commit'] + '\n')
              output.write('matrix=' + json.dumps({'subtarget': list(catalog['targets'])}) + '\n')
          PY
      - name: Upload immutable build plan
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-build-plan
          path: build-plan/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUBTARGET: ${{ matrix.subtarget }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
      - name: Download shared build plan
        uses: actions/download-artifact@v4
        with:
          name: PonWrt-build-plan
          path: build-plan
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
      - name: Clone the shared PonWrt commit
        run: |
          git init openwrt
          git -C openwrt remote add origin "$SOURCE_REPO"
          git -C openwrt fetch --depth=1 -- origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          cp build-plan/feeds.conf.default build-plan/feeds-resolution.json openwrt/
      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-dl-${{ runner.os }}-${{ matrix.subtarget }}-${{ needs.prepare.outputs.source_commit }}-${{ hashFiles('config/**', 'scripts/customize.sh') }}
          restore-keys: |
            ponwrt-dl-${{ runner.os }}-${{ matrix.subtarget }}-
            ponwrt-dl-${{ runner.os }}-
      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Check pinned NPU plugin source before importing
        run: python3 -m unittest discover -s tests -p test_npu_import.py -v
      - name: Import existing custom packages
        working-directory: openwrt
        run: bash ../scripts/customize.sh
      - name: Configure all profiles with separate root filesystems
        working-directory: openwrt
        run: bash ../scripts/configure.sh "$SUBTARGET" ../build-plan/catalog.json
      - name: Run firmware publication checks
        env:
          PONWRT_TEST_SOURCE: openwrt
        run: python3 -m unittest discover -s tests -v
      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"
      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" V=s
      - name: Validate every device image and collect firmware
        run: bash scripts/collect.sh openwrt "output/$SUBTARGET" "$SUBTARGET" build-plan/catalog.json
      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-firmware-${{ matrix.subtarget }}
          path: output/${{ matrix.subtarget }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload configuration and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-diagnostics-${{ matrix.subtarget }}
          path: |
            openwrt/.config
            openwrt/feeds.conf.default
            openwrt/feeds-resolution.json
            openwrt/custom-package-commits.tsv
            openwrt/requested-packages-dropped.txt
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [prepare, build]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PonWrt-build-plan
          path: build-plan
      - name: Download all validated firmware sets
        uses: actions/download-artifact@v4
        with:
          pattern: PonWrt-firmware-*
          path: output
          merge-multiple: true
      - name: Check complete coverage and write release notes
        run: |
          python3 scripts/release-notes.py output build-plan/catalog.json release-notes.md
          cp build-plan/catalog.json output/device-catalog.json
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_DATE="$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')"
          TAG="ponwrt-${BUILD_DATE}-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PonWrt all PON devices ${BUILD_DATE}" \
            --notes-file release-notes.md --latest
